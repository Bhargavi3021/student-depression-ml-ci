apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-result-prediction
  labels:
    app: student-result-prediction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-result-prediction
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: student-result-prediction
    spec:
      containers:
        - name: student-result-api
          image: ghcr.io/bhargavi3021/student-depression-ml-ci-main:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      imagePullSecrets:
        - name: ghcr-secret
